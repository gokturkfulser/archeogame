<!doctype html>
<html><head><meta charset="utf-8"><title>capture</title></head>
<body style="margin:0;background:#888">
<canvas id="stage" width="1000" height="1200"></canvas>
<div hidden><section id="dialog"><div id="portrait"></div><div id="who"></div><p id="line"></p><button id="next"></button></section><div id="goal"><span id="goalText"></span><button id="replayBtn"></button><button id="hintBtn"></button></div></div>
<script type="module">
import { lamp, stage, W } from '/src/engine/core.ts';
import { deniz, denizScaleFor, drawDeniz, holdCheer, placeDeniz, updateDeniz, useImageSkin } from '/src/engine/deniz.ts';
useImageSkin();
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
window.capture = async (aimX, aimY) => {
  await wait(1200);
  stage.cv.style.width = '1000px';
  lamp.x = lamp.tx = 500 + aimX; lamp.y = lamp.ty = 1000 - aimY;
  placeDeniz();
  deniz.x = 500; deniz.face = 1; deniz.side = -1;
  holdCheer(true);
  for (let i = 0; i < 90; i++) { stage.T += 1 / 60; updateDeniz(1 / 60); }
  deniz.x = 500; deniz.speed = 0;
  const g = stage.ctx;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, 1000, 1200);
  drawDeniz(g, 1150, denizScaleFor(830));
  return { lens: deniz.lens, url: stage.cv.toDataURL('image/png') };
};
</script></body></html>
