<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geçiş demosu</title>
<style>
  html,body{margin:0;height:100%;background:#0b0820;color:#fff1d6;font-family:Georgia,serif;overflow:hidden}
  #stage{position:absolute;inset:0 0 64px 0;overflow:hidden;background:#0b0820}
  .scene{position:absolute;inset:0}
  .scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  #bar{position:absolute;left:0;right:0;bottom:0;height:64px;display:flex;gap:10px;align-items:center;justify-content:center;background:#150f38}
  button{font:inherit;font-size:16px;padding:8px 16px;border-radius:8px;border:2px solid #e0b25a;background:#2a1f66;color:#fff1d6;cursor:pointer}
  button:hover{background:#3b2b8c}
  /* ---- old: the plain curtain ---- */
  #oldC{position:absolute;inset:0;display:flex;pointer-events:none}
  #oldC i{flex:1;background:repeating-linear-gradient(90deg,#7a1f1a,#b8423a 12%,#7a1f1a 24%);transform:scaleX(0);transition:transform .7s ease}
  #oldC i:first-child{transform-origin:left}#oldC i:last-child{transform-origin:right}
  #oldC.on i{transform:scaleX(1)}
  /* ---- new: layered paper ---- */
  #newT{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .lay{position:absolute;top:0;bottom:0;width:116%;left:-8%;will-change:transform;transform:translateX(-120%)}
  .lay .glow{position:absolute;inset:0;mix-blend-mode:screen;opacity:.9}
  #screen{position:absolute;left:50%;top:50%;width:min(62vw,760px);aspect-ratio:16/8;translate:-50% -50%;opacity:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,#fff3cf 0,#f4d58c 55%,#d9a950 100%);border-radius:14px;
    box-shadow:0 0 0 6px #5b2d16,0 0 0 9px #e0b25a,0 0 90px 20px rgba(255,200,100,.55),inset 0 0 60px rgba(120,60,10,.45);
    display:grid;place-items:center;text-align:center;color:#3a1b0c}
  #screen small{display:block;font-style:italic;letter-spacing:.12em;font-size:clamp(14px,2vw,24px);color:#8a4a1a}
  #screen b{display:block;font-weight:400;font-size:clamp(34px,6vw,76px);margin-top:.15em}
  #screen::before{content:"";position:absolute;inset:10px;border-radius:8px;border:2px dotted rgba(110,50,10,.55)}
  #hint{position:absolute;left:12px;top:10px;font-size:14px;opacity:.8;text-shadow:0 1px 6px #000}
</style></head>
<body>
<div id="stage">
  <div class="scene" id="A"><img src="/assets/efes/liman-sky.webp"><img src="/assets/efes/liman-far.webp"><img src="/assets/efes/liman-mid.webp"><img src="/assets/efes/liman-fg.webp"></div>
  <div class="scene" id="B" hidden><img src="/assets/efes/tiyatro-sky.webp"><img src="/assets/efes/tiyatro-far.webp"><img src="/assets/efes/tiyatro-mid.webp"><img src="/assets/efes/tiyatro-fg.webp"></div>
  <div id="oldC"><i></i><i></i></div>
  <div id="newT"></div>
  <div id="screen"><div><small id="sn">İkinci sahne</small><b id="sm">Büyük Tiyatro</b></div></div>
  <div id="hint">Sesli: sayfaya bir kez tıkla</div>
</div>
<div id="bar">
  <button id="bOld">Eski perde</button>
  <button id="bR">Yeni → soldan sağa</button>
  <button id="bL">Yeni ← sağdan sola</button>
  <button id="bU">Yeni ↑ aşağıdan yukarı</button>
</div>
<script>
const $ = (s) => document.querySelector(s);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
let cur = 'A', busy = false, ac;
const names = { A: ['Birinci sahne', 'Liman Caddesi'], B: ['İkinci sahne', 'Büyük Tiyatro'] };
const swap = () => { const n = cur === 'A' ? 'B' : 'A'; $('#' + cur).hidden = true; $('#' + n).hidden = false; cur = n; };

/* ---- sound: paper swish and a soft wooden knock, all synthesized ---- */
function audio() { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; }
function noise(t0, dur, f0, f1, vol) {
  const a = audio(), n = a.sampleRate * dur, buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const s = a.createBufferSource(); s.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.8; f.frequency.setValueAtTime(f0, t0); f.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
  const g = a.createGain(); g.gain.value = vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start(t0);
}
function knock(t0, vol = .35) {
  const a = audio(), o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(190, t0); o.frequency.exponentialRampToValueAtTime(70, t0 + .12);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + .16); o.connect(g); g.connect(a.destination); o.start(t0); o.stop(t0 + .2);
}

/* ---- old curtain ---- */
async function oldGo() {
  if (busy) return; busy = true;
  $('#oldC').classList.add('on'); await wait(750); swap();
  await wait(250); $('#oldC').classList.remove('on'); await wait(750); busy = false;
}

/* ---- new: three cut-paper layers, a Karagöz screen with the scene title ---- */
const LAYERS = [
  { c1: '#7a2a24', c2: '#a8423a', dur: 0.95, delay: 0.00, hole: 'rgba(255,170,90,.95)' },   // far, slow, madder red
  { c1: '#1d3a8f', c2: '#2c55b8', dur: 0.80, delay: 0.07, hole: 'rgba(120,225,235,.95)' },  // lapis
  { c1: '#150f38', c2: '#241a5c', dur: 0.66, delay: 0.14, hole: 'rgba(255,214,120,.98)' },  // near, fast, deep indigo
];
function edgePath(rng, side) {
  // a hand-cut edge: wobbling line with a few notches, on the leading side (right in a left-to-right move)
  const pts = []; const N = 26;
  for (let i = 0; i <= N; i++) { const y = (i / N) * 100; const w = 3 + Math.sin(i * 1.9 + rng) * 1.6 + (i % 5 === 0 ? 2.4 : 0) + ((i * 7 + rng * 3) % 3) * .4; pts.push([100 - w, y]); }
  return 'polygon(0 0,' + pts.map(([x, y]) => x.toFixed(1) + '% ' + y.toFixed(1) + '%').join(',') + ',100% 100%,0 100%)';
}
function dots(color) {
  // punched holes along the leading edge and in a strip, glowing through
  return `radial-gradient(circle,${color} 0 2.6px,transparent 3.4px) 0 0/26px 26px,` +
         `radial-gradient(circle,${color} 0 1.6px,transparent 2.4px) 13px 13px/26px 26px`;
}
function build(dir) {
  const host = $('#newT'); host.innerHTML = '';
  const vertical = dir === 'U';
  return LAYERS.map((L, i) => {
    const el = document.createElement('div'); el.className = 'lay';
    el.style.background = `linear-gradient(${vertical ? 0 : 90}deg,${L.c1},${L.c2})`;
    el.style.clipPath = edgePath(i * 2.3);
    el.style.boxShadow = '0 0 40px rgba(0,0,0,.6)';
    const g = document.createElement('div'); g.className = 'glow';
    g.style.background = dots(L.hole);
    g.style.maskImage = g.style.webkitMaskImage = 'linear-gradient(90deg,transparent 78%,#000 92%,#000 97%,transparent 100%)';
    el.appendChild(g);
    // fibre
    const f = document.createElement('div'); f.style.cssText = 'position:absolute;inset:0;opacity:.18;mix-blend-mode:multiply;background:repeating-linear-gradient(80deg,rgba(0,0,0,.5) 0 1px,transparent 1px 5px),repeating-linear-gradient(170deg,rgba(0,0,0,.4) 0 1px,transparent 1px 7px)';
    el.appendChild(f);
    host.appendChild(el);
    if (vertical) { el.style.cssText += ';left:0;right:0;width:auto;top:-8%;bottom:auto;height:116%;clip-path:none;border-radius:0 0 40% 40% / 0 0 6% 6%'; el.querySelector('.glow').style.maskImage = el.querySelector('.glow').style.webkitMaskImage = 'linear-gradient(180deg,transparent 78%,#000 92%,transparent 100%)'; }
    return { el, L };
  });
}
async function newGo(dir) {
  if (busy) return; busy = true;
  const ls = build(dir), vertical = dir === 'U', sign = dir === 'L' ? -1 : 1;
  // direction: R slides in from the left (leading edge on the right); L mirrors it; U rises from the bottom
  const from = vertical ? 'translateY(120%)' : `translateX(${-120 * sign}%)`;
  const to0 = vertical ? 'translateY(0)' : 'translateX(0)';
  const out = vertical ? 'translateY(-125%)' : `translateX(${125 * sign}%)`;
  ls.forEach(({ el }) => { el.style.transform = from; if (dir === 'L') el.style.scale = '-1 1'; });
  const t = audio().currentTime + 0.02;
  noise(t, 0.9, 700, 2600, .25); noise(t + .12, .75, 500, 1800, .18);
  const ins = ls.map(({ el, L }) => el.animate([{ transform: from }, { transform: to0 }], { duration: L.dur * 1000, delay: L.delay * 1000, easing: 'cubic-bezier(.3,.0,.2,1)', fill: 'forwards' }));
  await wait(1250);
  knock(audio().currentTime + .02);
  swap();
  $('#sn').textContent = names[cur][0]; $('#sm').textContent = names[cur][1];
  const sc = $('#screen');
  sc.animate([{ opacity: 0, transform: 'scale(.92)', filter: 'blur(6px)' }, { opacity: 1, transform: 'scale(1)', filter: 'blur(0)' }], { duration: 480, easing: 'ease-out', fill: 'forwards' });
  await wait(1350);
  sc.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 260, fill: 'forwards' });
  const t2 = audio().currentTime + .1;
  noise(t2, 0.9, 2400, 600, .25); noise(t2 + .1, .75, 1700, 500, .18);
  await wait(200);
  ls.slice().reverse().forEach(({ el, L }, k) => el.animate([{ transform: to0 }, { transform: out }], { duration: (L.dur + .1) * 1000, delay: k * 70, easing: 'cubic-bezier(.6,0,.7,.4)', fill: 'forwards' }));
  await wait(1250);
  $('#newT').innerHTML = ''; busy = false;
}
$('#bOld').onclick = oldGo;
$('#bR').onclick = () => newGo('R');
$('#bL').onclick = () => newGo('L');
$('#bU').onclick = () => newGo('U');
window.newGo = newGo; window.oldGo = oldGo;
</script>
</body></html>
