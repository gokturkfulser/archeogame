<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Perde Perde Anadolu: Eski Kitap</title>
<meta name="description" content="Perde Perde Anadolu, başlangıç: Deniz dedesinin odasında eski bir kitap buluyor.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Caveat:wght@500;700&family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/engine/engine.css">
</head>
<body>
<canvas id="stage" aria-label="Dedenin karanlık çalışma odası"></canvas>
<div id="hotspots"></div>

<header class="hud">
  <div class="mark"><span class="series">Perde Perde Anadolu</span><span class="where" id="where">Başlangıç</span></div>
  <div class="hud-right">
    <div id="coins" hidden role="img" aria-label="Sikkeler"></div>
    <button class="iconbtn" id="sound" aria-label="Sesi kapat" aria-pressed="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path class="w1" d="M16.5 8.5a5 5 0 0 1 0 7"/><path class="w2" d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
  </div>
</header>

<div id="goal" hidden><span id="goalText"></span><button class="gbtn alt" id="replayBtn" hidden>Ezgiyi dinle</button><button class="gbtn" id="hintBtn">İpucu</button></div>
<div id="tray" hidden></div>

<div id="sceneTitle" aria-hidden="true"><span class="num"></span><span class="name"></span></div>

<section id="dialog" hidden aria-live="polite">
  <div class="portrait" id="portrait"></div>
  <div class="dbody"><div class="who" id="who"></div><p id="line"></p></div>
  <button id="next">Devam</button>
</section>

<div class="overlay" id="card" hidden role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card">
    <p class="k"></p>
    <h2 id="cardTitle"></h2>
    <div id="cardFacts"></div>
    <div class="piece" id="cardPiece"><canvas width="128" height="128"></canvas><span></span></div>
    <button class="go" id="cardGo">Devam et</button>
  </div>
</div>


<div id="title" style="--title-art:url(/assets/baslangic/wall.webp)">
  <div class="title-top">
    <p class="t-series">Perde Perde Anadolu</p>
    <h1>Eski Kitap</h1>
    <p class="t-act">Başlangıç</p>
  </div>
  <img class="title-book" src="/assets/book/closed.webp" alt="" draggable="false">
  <div class="title-bottom">
    <button id="start">Odaya gir</button>
    <p class="t-note">Sesi aç. Fareni ya da parmağını gezdir; Deniz el fenerini oraya doğrultur, ışık saklı olanı gösterir.</p>
    <p class="t-rotate">Telefonu yan çevirirsen sahne büyür.</p>
  </div>
</div>

<script type="module" src="/src/acts/baslangic/index.ts"></script>
</body>
</html>
